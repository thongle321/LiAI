[project]
name = "liai-backend"
version = "0.1.0"
description = "LiAI backend — slice 1: stateless health + chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "supabase>=2.31.0",
    "pydantic-ai-slim[openrouter]>=2.42.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
