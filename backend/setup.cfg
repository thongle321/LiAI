[importlinter]
root_package = app

# ADR-0002 rule 3: <module>.internal is private. Each contract lists every
# module EXCEPT the owner as sources, so owner self-imports need no ignores.
# Tests are not listed, so test patching (e.g. MODELS_DIR) stays allowed.
[importlinter:contract:1]
name = models internals are private to the models module
type = forbidden
source_modules =
    app.main
    app.modules.companion
    app.modules.chat
    app.modules.vision
    app.shared
forbidden_modules =
    app.modules.models.internal
ignore_imports =
    app.modules.models.router -> app.modules.models.internal

[importlinter:contract:2]
name = vision internals are private to the vision module
type = forbidden
source_modules =
    app.main
    app.modules.models
    app.modules.companion
    app.modules.chat
    app.shared
forbidden_modules =
    app.modules.vision.internal.ws
    app.modules.vision.internal.qa
