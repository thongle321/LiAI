[importlinter]
root_package = app

# ADR-0002 rule 3: <module>.internal is private. Tests are not listed, so
# test patching (e.g. MODELS_DIR) stays allowed. New modules add their
# internal package + self-import ignore here (step 6: chat, vision).
[importlinter:contract:1]
name = models internals are private to the models module
type = forbidden
source_modules =
    app.main
    app.routers
    app.realtime
    app.modules.models
    app.modules.companion
    app.shared
forbidden_modules =
    app.modules.models.internal
ignore_imports =
    app.modules.models.router -> app.modules.models.internal
