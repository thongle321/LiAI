plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  // Room generates its DAO/Database implementations at compile time, which
  // needs an annotation processor. kapt rather than KSP because it needs no
  // extra plugin version alignment with the Kotlin the Expo plugin applies.
  id 'kotlin-kapt'
}

group = 'com.anonymous.liai.download'
version = '0.1.0'

dependencies {
  // Room, matching pocketpal-ai's download store. suspend + Flow rather than
  // a JSON file, so two workers writing at once cannot corrupt the state.
  // Room 2.7.x, not 2.6.x: the 2.6 compiler bundles kotlinx-metadata that
  // cannot read Kotlin 2.1 metadata ("Provided Metadata instance has version
  // 2.1.0, while maximum supported version is 2.0.0"). Downgrading Kotlin is
  // not an option — expo-module-gradle-plugin owns it.
  implementation "androidx.room:room-runtime:2.7.1"
  implementation "androidx.room:room-ktx:2.7.1"
  kapt "androidx.room:room-compiler:2.7.1"
  // The transfer runs in a WorkManager CoroutineWorker so it survives the
  // app process being killed, which a JS-driven download cannot.
  implementation "androidx.work:work-runtime-ktx:2.9.1"
  // Pinned to the version expo-file-system already puts on the classpath
  // (android/build.gradle:24) so the two cannot resolve to different OkHttps
  // in the same build.
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
  // NotificationCompat, for the foreground service that lifts WorkManager's
  // ten-minute cap. Without it every multi-GB model gets killed mid-transfer.
  implementation "androidx.core:core-ktx:1.13.1"
  // JSON status blob so a killed process can hand its state to the next
  // launch. Room is deliberately not used: there are no queries to run, only
  // a record to read back.
  implementation "com.google.code.gson:gson:2.11.0"
}

android {
  namespace "com.anonymous.liai.download"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
