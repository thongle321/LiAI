[project]
name = "liai-backend"
version = "0.1.0"
description = "LiAI backend — slice 1: stateless health + chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "supabase>=2.31.0",
    "pydantic-ai-slim[openrouter]>=2.42.0",
    "huggingface-hub>=0.23.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.9",
    "llama-cpp-python",
    "trafilatura>=2.2.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
llama-cpp-python = { path = "./llama_cpp_python-0.4.0+cu131-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
